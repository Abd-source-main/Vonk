# Apache rules. Append to .htaccess at the published root.
#
# Note the ordering: canonical host and protocol first, then the legacy locale
# paths. Doing it the other way round produces a redirect chain, which wastes
# crawl budget and slows the first paint for every visitor.
#
# There is deliberately no rule for `/`. Dutch is the default locale and is
# served from the root as a real page, so the homepage never redirects.

RewriteEngine On

# 1. Force HTTPS
RewriteCond %{HTTPS} !=on
RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

# 2. Force the apex host (drop www)
RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

# 3. The old two-folder layout: /nl/ has been flattened onto the root.
RewriteRule ^nl/?$                          /                          [R=301,L]
RewriteRule ^nl/index\.dc\.html$            /                          [R=301,L]
RewriteRule ^nl/diensten\.dc\.html$         /diensten.html             [R=301,L]
RewriteRule ^nl/over-ons\.dc\.html$         /over-ons.html             [R=301,L]
RewriteRule ^nl/contact\.dc\.html$          /contact.html              [R=301,L]
RewriteRule ^nl/(.*)$                       /$1                        [R=301,L]

# 4. The design-tool extension, dropped from every filename.
RewriteRule ^en/index\.dc\.html$            /en/                       [R=301,L]
RewriteRule ^en/([a-z-]+)\.dc\.html$        /en/$1.html                [R=301,L]

# 5. Old prototype filenames
RedirectMatch 301 "^/Vonk Elektra Homepage\.dc\.html$"  /
RedirectMatch 301 "^/Services & Portfolio\.dc\.html$"   /diensten.html
RedirectMatch 301 "^/About\.dc\.html$"                  /over-ons.html
RedirectMatch 301 "^/Contact\.dc\.html$"                /contact.html
RedirectMatch 301 "^/privacy\.html$"                    /privacybeleid.html
RedirectMatch 301 "^/terms\.html$"                      /algemene-voorwaarden.html

# 6. Convenience aliases
Redirect 301 /contact  /contact.html
Redirect 301 /diensten /diensten.html
