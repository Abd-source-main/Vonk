# Apache rules. Append to .htaccess at the published root.
#
# Note the ordering: canonical host and protocol first, then locale routing.
# Doing it the other way round produces a redirect chain, which wastes crawl
# budget and slows the first paint for every visitor.

RewriteEngine On

# 1. Force HTTPS
RewriteCond %{HTTPS} !=on
RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]

# 2. Force the apex host (drop www)
RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
RewriteRule ^(.*)$ https://%1/$1 [R=301,L]

# 3. Root to Dutch. Comment this out to serve the language chooser instead.
RewriteRule ^$ /nl/ [R=301,L]

# 4. Old prototype filenames
RedirectMatch 301 "^/Vonk Elektra Homepage\.dc\.html$"  /nl/index.dc.html
RedirectMatch 301 "^/Services & Portfolio\.dc\.html$"   /nl/diensten.dc.html
RedirectMatch 301 "^/About\.dc\.html$"                  /nl/over-ons.dc.html
RedirectMatch 301 "^/Contact\.dc\.html$"                /nl/contact.dc.html
RedirectMatch 301 "^/privacy\.html$"                    /nl/privacybeleid.html
RedirectMatch 301 "^/terms\.html$"                      /nl/algemene-voorwaarden.html

# 5. Convenience aliases
Redirect 301 /contact  /nl/contact.dc.html
Redirect 301 /diensten /nl/diensten.dc.html
